<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGain — Deep Focus Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(139, 92, 246, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      backdrop-filter: blur(16px);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(139, 92, 246, 0.15);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .shield-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .quote {
      font-style: italic;
      color: #e2e8f0;
      background: rgba(30, 41, 59, 0.6);
      border-left: 3px solid #8b5cf6;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }
    .btn-secondary {
      background: transparent;
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: none;
      margin-top: 12px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span>●</span> Study Whitelist Active
    </div>
    <div class="shield-icon">🛡️</div>
    <h1>Stay in the Flow</h1>
    <p>This site is not on your approved Study Mode whitelist. Protect your cognitive momentum and return to your focus objective.</p>
    
    <div class="quote">
      "Deep work is the ability to focus without distraction on a cognitively demanding task." — Cal Newport
    </div>

    <button id="return-btn" class="btn" onclick="history.back()">
      ← Return to Previous Page
    </button>
    
    <button id="open-hub" class="btn btn-secondary" onclick="window.location.href='http://localhost:3000'">
      Open FocusGain Dashboard
    </button>
  </div>
</body>
</html>
